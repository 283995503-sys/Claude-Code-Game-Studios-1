<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烽火三国 - 战斗与奖励细化版</title><body style="margin:0;background:#211915;color:#f5e9cf;font:16px system-ui;padding:2rem"><p id="status">正在检查游戏代码并启动细化版……</p><script>
(async()=>{const out=document.getElementById('status');try{const r=await fetch('./index.html',{cache:'no-store'});if(!r.ok)throw Error(`index.html HTTP ${r.status}`);let src=await r.text();const patches=[
["function useSkill(s){let target=nearest(Math.min(s.range,game.range+100));if(!target)return;const p=game.p","function nearestPriorityTarget(range){let nearestEnemy=null,nearestDistance=range,priority=null,priorityDistance=Math.min(range,C.eliteAggroRange);for(const enemy of game.enemies){const d=dist(game.p,enemy);if(d>range)continue;if(d<nearestDistance){nearestDistance=d;nearestEnemy=enemy}if((enemy.kind==='elite'||enemy.kind==='boss')&&d<=C.eliteAggroRange&&d<priorityDistance){priorityDistance=d;priority=enemy}}return priority||nearestEnemy}\nfunction useSkill(s){let target=(s.type==='single'||s.type==='lottery')?nearestPriorityTarget(Math.min(s.range,game.range+100)):nearest(Math.min(s.range,game.range+100));if(!target)return;const p=game.p","single-target target priority"],
["function buildChestEquipmentCards(){let options=[];for(const d of EQUIPMENT_POOL){const equipped=game.gear[d.slot];options.push({type:equipped?.id===d.id?'equipment-upgrade':equipped?'equipment-replace':'equipment-new',equipment:d})}return sampleThree(options)}","function buildChestEquipmentCards(){const missingSlots=slots.filter(slot=>!game.gear[slot]);let fill=[];for(const d of EQUIPMENT_POOL){if(missingSlots.includes(d.slot)&&!game.gear[d.slot])fill.push({type:'equipment-new',equipment:d})}fill=fill.filter((card,index,list)=>list.findIndex(other=>other.equipment.slot===card.equipment.slot)===index);const upgrades=[];for(const d of EQUIPMENT_POOL){if(game.gear[d.slot]?.id===d.id)upgrades.push({type:'equipment-upgrade',equipment:d})}const replacements=[];if(missingSlots.length===0)for(const d of EQUIPMENT_POOL){if(game.gear[d.slot]&&game.gear[d.slot].id!==d.id)replacements.push({type:'equipment-replace',equipment:d})}return [...sampleThree(fill),...sampleThree(upgrades),...sampleThree(replacements)].slice(0,3)}","equipment slots, then upgrades, then replacements"],
["function openLevelSkillReward(){game.rewardQueue.push('skill');showNextReward()}function openChestEquipmentReward(){game.rewardQueue.push('equipment');showNextReward()}","function openLevelSkillReward(){game.rewardOrigin='level';game.rewardQueue.push('skill');showNextReward()}function openChestEquipmentReward(){game.rewardOrigin='chest';game.rewardQueue.push('equipment');showNextReward()}","reward origin separation"],
["function queueKillRewards(kind){if(kind==='elite')game.rewardQueue.push('skill','equipment');else if(kind==='boss')game.rewardQueue.push('skill','skill','equipment','equipment');if(game.rewardQueue.length)showNextReward()}","function queueKillRewards(kind){if(kind==='elite'){game.rewardOrigin='elite';game.rewardQueue.push('skill','equipment')}else if(kind==='boss'){game.rewardOrigin='boss';game.rewardQueue.push('skill','skill','equipment','equipment')}if(game.rewardQueue.length)showNextReward()}","elite/Boss reward queues"],
["const cards=type==='skill'?buildLevelSkillCards():buildChestEquipmentCards();$('pickEyebrow')","const cards=type==='skill'?buildLevelSkillCards():buildChestEquipmentCards();game.currentRewardCards=cards;game.rewardBusy=false;$('pickEyebrow')","stable reward card snapshot"],
["function renderRewardCards(type,cards){const box=$('cards');box.replaceChildren();for(const card of cards){const v=rewardCardView(card),button=document.createElement('button');button.className='card';button.type='button';button.innerHTML=`<div class=\"icon\">${v.icon}</div><strong>${v.title}</strong><span>${v.description}</span>`;button.onclick=()=>selectRewardCard(type,card);box.append(button)}}","function renderRewardCards(type,cards){const box=$('cards');box.replaceChildren();for(const card of cards){const v=rewardCardView(card),button=document.createElement('button');button.className='card';button.type='button';button.innerHTML=`<div class=\"icon\">${v.icon}</div><strong>${v.title}</strong><span>${v.description}</span>`;button.onclick=()=>{if(game.rewardBusy)return;game.rewardBusy=true;for(const item of box.querySelectorAll('button'))item.disabled=true;selectRewardCard(type,card)};box.append(button)}}","prevent repeated reward selections"],
["function selectRewardCard(type,card){if(type!==game.activeRewardType)return;","function selectRewardCard(type,card){if(type!==game.activeRewardType||(type==='skill'&&!card.type.startsWith('skill-'))||(type==='equipment'&&!card.type.startsWith('equipment-')))return;","reward type guard"],
["function applyEquipmentReward(card){if(!card.type.startsWith('equipment-')||card.type==='equipment-replace')return false;const gear=card.equipment,old=game.gear[gear.slot];if(card.type==='equipment-upgrade'&&old?.id===gear.id)old.level++;else if(card.type==='equipment-new'&&!old)game.gear[gear.slot]={...gear,level:1};else return false;recalculateEquipmentStats();return true}","function applyEquipmentReward(card,confirmed=false){if(!card.type.startsWith('equipment-'))return false;const gear=card.equipment,old=game.gear[gear.slot];if(card.type==='equipment-upgrade'&&old?.id===gear.id)old.level++;else if(card.type==='equipment-new'&&!old)game.gear[gear.slot]={...gear,level:1};else if(card.type==='equipment-replace'&&old&&confirmed)game.gear[gear.slot]={...gear,level:1};else return false;recalculateEquipmentStats();return true}","unified equipment apply path"],
["$('confirmReplace').onclick=()=>{const card=game?.pendingEquipment;if(!card||game.activeRewardType!=='equipment')return;game.gear[card.equipment.slot]={...card.equipment,level:1};recalculateEquipmentStats();hud();completeRewardCard('equipment')};$('cancelReplace').onclick=()=>{game.pendingEquipment=null;showNextReward()};","$('confirmReplace').onclick=()=>{const card=game?.pendingEquipment;if(!card||game.activeRewardType!=='equipment')return;if(!applyEquipmentReward(card,true))return;game.pendingEquipment=null;hud();completeRewardCard('equipment')};$('cancelReplace').onclick=()=>{game.pendingEquipment=null;game.rewardBusy=false;renderRewardCards('equipment',game.currentRewardCards);state='reward';show('pick')};","replacement confirmation and stable cancel"],
["if(e.kind==='boss'&&game.bossIndex>=C.bossTotal){endGame(true);return}if(e.kind==='elite'||e.kind==='boss'){queueKillRewards(e.kind);return}","if(e.kind==='boss'&&game.bossIndex>=C.bossTotal){game.pendingVictory=true;queueKillRewards(e.kind);return}if(e.kind==='elite'||e.kind==='boss'){queueKillRewards(e.kind);return}","final Boss reward before victory"],
["function finishRewardSequence(){game.rewardQueue=[];game.activeRewardType=null;game.rewardSource=null;game.pendingEquipment=null;if(game.chest){game.chest=null;game.chestKills=0;chestPriceAfterPurchase();spawnChest()}state='playing';hide();last=performance.now();hud()}","function finishRewardSequence(){const origin=game.rewardOrigin;game.rewardQueue=[];game.activeRewardType=null;game.rewardSource=null;game.rewardOrigin=null;game.currentRewardCards=[];game.rewardBusy=false;game.pendingEquipment=null;if(origin==='chest'&&game.chest){game.chest=null;game.chestKills=0;chestPriceAfterPurchase();spawnChest()}if(game.pendingVictory){game.pendingVictory=false;endGame(true);return}state='playing';hide();last=performance.now();hud()}","origin-aware reward cleanup"],
["const rate=game.t<60?C.smallPerSecond:C.postMinuteSmallPerSecond;game.spawnClock+=dt;","const rate=game.t<15?1.5:game.t<60?C.smallPerSecond:C.postMinuteSmallPerSecond;game.spawnClock+=dt;","opening combat cadence"],
["e.phase=Math.random()<.55?'aim':'arc';e.telegraph=1;e.aim={x:game.p.x,y:game.p.y};","e.phase=Math.random()<.55?'aim':'arc';e.telegraph=e.phase==='aim'?1.2:1;e.aim={x:game.p.x,y:game.p.y};toast(e.phase==='aim'?'Boss锁定落点！离开红圈':'Boss扇形攻击！及时闪避');","clear Boss attack telegraphs"],
["ctx.fillText(boss?'Boss':'精英',0,by-4)","ctx.fillText(boss?(e.phase==='aim'?'锁定落点':e.phase==='arc'?'扇形攻击':'Boss'):(e.aggro?'追击中':'精英警戒'),0,by-4)","visible elite/Boss state label"]
];for(const [before,after,label]of patches){const n=src.split(before).length-1;if(n!==1)throw Error(`${label}: expected one source anchor, found ${n}; refusing partial patch`);src=src.replace(before,after)}if(!src.includes('function buildLevelSkillCards()')||!src.includes('function buildChestEquipmentCards()'))throw Error('Reward pool anchors missing');document.open();document.write(src);document.close()}catch(e){out.textContent=`未能启动安全细化版：${e.message}。请通过 HTTP 服务器访问，并确认同目录存在 index.html。`}})();
