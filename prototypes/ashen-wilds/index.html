<body><main id="game"><canvas id="world" aria-label="三国风格生存战斗"></canvas>
<section class="hud"><div class="top"><span class="brand">烽火三国 · 乱世求生</span><span class="stats"><span id="clock">00:00</span><span id="level">Lv.1</span><span id="kills">击杀 0</span><span id="gold">金币 25</span><span id="bossCount">Boss 0/5</span></span></div><div class="bar"><div class="fill hp" id="hpFill"></div></div><div class="bar xp"><div class="fill" id="xpFill"></div></div><div class="equip" id="equip"></div></section>

<section class="overlay" id="start"><div class="panel"><div class="eyebrow">原创三国题材 · Q版手绘风格原型</div><h1>烽火三国</h1><h2>乱世求生</h2><p class="sub">化身乱世武将，在自动攻击与走位中抵御一波波敌军。拾取战利品、购买宝箱奖励、搭配技能与装备，迎战五位首领。</p><button class="button" id="startBtn">开始征战</button><p class="sub">键盘 WASD/方向键移动，空格/Shift 闪避，Esc 暂停；手机可用虚拟摇杆。开局赠送 25 金币，可开启第一只宝箱。</p></div></section>
<section class="overlay hidden" id="pick" role="dialog" aria-modal="true"><div class="panel"><div class="eyebrow" id="pickEyebrow">战利品</div><h2 id="pickTitle">选择奖励</h2><p class="sub" id="pickSub"></p><div class="cards" id="cards"></div></div></section>
<section class="overlay hidden" id="replace" role="dialog" aria-modal="true"><div class="panel"><div class="eyebrow">装备替换确认</div><h2 id="replaceTitle">替换装备？</h2><p class="sub" id="replaceSub"></p><div class="compare"><div><b>当前穿戴</b><div id="oldGear"></div></div><div><b>候选装备</b><div id="newGear"></div></div></div><button class="button" id="confirmReplace">确认替换</button> <button class="button" id="cancelReplace">取消，保留原装备</button></div></section>

</main>
<script>
(()=>{'use strict';
// 世界坐标固定为 800×1200；视口缩放并跟随玩家。价格、刷怪和奖励参数集中于此。
const C={mapW:800,mapH:1200,smallPerSecond:3,postMinuteSmallPerSecond:1,eliteDefenseFactor:20,eliteWaveStarts:[60,300,540,780,1020],eliteWaveCount:4,eliteSpacing:20,bossFirst:240,bossInterval:240,bossTotal:5,chestKills:15,playerSpeed:205,playerHealth:120,startingDamage:18,attackRange:260,attackRate:.72,levelXp:5,xpStep:3,eliteAggroRange:235,smallCap:100,chestFirstPrice:25,chestFirstGap:13};
const GEAR=[
{id:'repeater',name:'诸葛连弩',slot:'武器',icon:'🏹',stat:'攻击 +8',bonus:{damage:8}},{id:'sword',name:'青釭剑',slot:'武器',icon:'🗡️',stat:'攻击 +14',bonus:{damage:14}},{id:'spear',name:'丈八蛇矛',slot:'武器',icon:'🔱',stat:'攻击 +11，范围 +20',bonus:{damage:11,range:20}},{id:'guandao',name:'青龙偃月刀',slot:'武器',icon:'⚔️',stat:'攻击 +18',bonus:{damage:18}},{id:'halberd',name:'方天画戟',slot:'武器',icon:'戟',stat:'攻击 +16，范围 +15',bonus:{damage:16,range:15}},{id:'fan',name:'朱雀羽扇',slot:'武器',icon:'🪭',stat:'攻击 +9，攻速 +12%',bonus:{damage:9,rate:.12}},{id:'saber',name:'古锭刀',slot:'武器',icon:'刀',stat:'攻击 +12',bonus:{damage:12}},
{id:'bagua',name:'八卦阵',slot:'盾牌',icon:'☯️',stat:'减伤 +12%',bonus:{reduction:.12}},{id:'shield',name:'仁王盾',slot:'盾牌',icon:'🛡️',stat:'减伤 +18%',bonus:{reduction:.18}},{id:'rattan',name:'藤甲',slot:'护甲',icon:'🪖',stat:'生命 +45',bonus:{health:45}},{id:'warhorse',name:'赤兔马',slot:'坐骑',icon:'🐎',stat:'移速 +16%',bonus:{speed:.16}},{id:'dilu',name:'的卢',slot:'坐骑',icon:'🐴',stat:'移速 +10%，生命 +20',bonus:{speed:.10,health:20}},{id:'jueying',name:'绝影',slot:'坐骑',icon:'🐎',stat:'移速 +13%',bonus:{speed:.13}},{id:'jade',name:'传国玉玺',slot:'饰品',icon:'🟨',stat:'攻击 +6，经验 +15%',bonus:{damage:6,xp:.15}}
];
const SKILLS=[{id:'bolt',name:'连弩齐射',icon:'🏹',desc:'自动锁定范围内最近敌人，发射穿透箭矢。',range:300,rate:.7,damage:18,type:'single'},{id:'whirl',name:'旋刃风暴',icon:'🌀',desc:'圆形范围攻击，圈内敌人全部命中。',range:115,rate:3.4,damage:24,type:'circle'},{id:'spear',name:'贯日长枪',icon:'🔱',desc:'对前方扇形区域内所有敌人造成伤害。',range:210,rate:2.6,damage:32,type:'fan'},{id:'lightning',name:'五雷轰顶',icon:'⚡',desc:'单体攻击随机追加 1–3 段，每段伤害独立抽取。',range:280,rate:2.2,damage:30,type:'lottery'},{id:'flame',name:'赤焰阵',icon:'🔥',desc:'脚下火焰圆阵，范围内敌人受创。',range:155,rate:4.2,damage:20,type:'circle'},{id:'guard',name:'虎卫护体',icon:'🐯',desc:'护体罡气周期震荡，伤害近身敌军。',range:92,rate:2.8,damage:22,type:'circle'}];
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');let W=1,H=1,dpr=1,scale=1,viewW=800,viewH=1200,state='menu',game=null,last=0,keys=new Set(),touch={x:0,y:0},replacePending=null,toastTimer=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),slots=['武器','盾牌','护甲','坐骑','饰品'];
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/C.mapW,H/C.mapH);viewW=W/scale;viewH=H/scale}
addEventListener('resize',resize);resize();
function fresh(){game={t:0,p:{x:C.mapW/2,y:C.mapH/2,r:14,hp:C.playerHealth,max:C.playerHealth,inv:0,fx:1,fy:0},damage:C.startingDamage,range:C.attackRange,rate:C.attackRate,speed:C.playerSpeed,reduction:0,xpBonus:0,xp:0,next:C.levelXp,level:1,kills:0,smallKills:0,chestKills:0,gold:25,chestPrice:C.chestFirstPrice,chestGap:C.chestFirstGap,chest:null,enemies:[],shots:[],gems:[],fx:[],skills:[{...SKILLS[0],level:1,cool:.2}],gear:Object.fromEntries(slots.map(s=>[s,null])),eliteSchedule:C.eliteWaveStarts.flatMap(t=>Array.from({length:C.eliteWaveCount},(_,i)=>t+i*C.eliteSpacing)).sort((a,b)=>a-b),eliteIndex:0,bossIndex:0,bossNext:C.bossFirst,spawnClock:0};state='playing';hide();spawnChest();hud();last=performance.now()}
function hide(){['start','pick','replace','pause','end'].forEach(id=>$(id).classList.add('hidden'))}function show(id){hide();$(id).classList.remove('hidden')}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');toastTimer=2.2}
function chestPriceAfterPurchase(){game.chestPrice+=game.chestGap;game.chestGap=Math.round(1.3*game.chestGap)}
function spawnChest(){if(game.chest)return;let a=rand(0,Math.PI*2),r=rand(160,280);game.chest={x:clamp(game.p.x+Math.cos(a)*r,40,C.mapW-40),y:clamp(game.p.y+Math.sin(a)*r,40,C.mapH-40),r:17,price:game.chestPrice}}
function hud(){if(!game)return;$('clock').textContent=fmt(game.t);$('level').textContent=`Lv.${game.level}`;$('kills').textContent=`击杀 ${game.kills}`;$('gold').textContent=`金币 ${game.gold}`;$('bossCount').textContent=`Boss ${game.bossIndex}/5`;$('hpFill').style.width=`${clamp(game.p.hp/game.p.max*100,0,100)}%`;$('xpFill').style.width=`${clamp(game.xp/game.next*100,0,100)}%`;const eq=$('equip');eq.replaceChildren();slots.forEach(s=>{const el=document.createElement('span');el.className='equipItem'+(game.gear[s]?'':' empty');el.textContent=game.gear[s]?`${game.gear[s].icon}${game.gear[s].name} Lv${game.gear[s].level}`:`${s} · 空`;eq.append(el)});const bar=$('skillbar');bar.replaceChildren();for(const s of game.skills){const el=document.createElement('div');el.className='skill';el.title=`${s.name} Lv${s.level}`;el.innerHTML=`${s.icon}<small>${s.level}</small>`;bar.append(el)}}function fmt(t){let n=Math.floor(t);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function spawnEnemy(kind='small',eliteIndex=0){if(game.enemies.length>=C.smallCap&&kind==='small')return;let x,y;if(kind==='elite'){const offsets=[[0,-320],[320,0],[0,320],[-320,0]],o=offsets[eliteIndex%4];x=clamp(game.p.x+o[0],35,C.mapW-35);y=clamp(game.p.y+o[1],35,C.mapH-35)}else{let side=Math.floor(Math.random()*4),pad=28;x=side===0?-pad:side===1?C.mapW+pad:rand(0,C.mapW);y=side===2?-pad:side===3?C.mapH+pad:rand(0,C.mapH)}let boss=kind==='boss',elite=kind==='elite',hp=boss?1900:elite?780:65,rad=boss?31:elite?21:rand(12,16);game.enemies.push({x,y,r:rad,hp,max:hp,kind,damage:boss?38:elite?18:9,speed:boss?38:elite?53:rand(43,58),aggro:false,hit:0,attackClock:rand(1.8,3),phase:'idle',telegraph:0,aim:null,angle:0});if(elite){toast(`精英来袭！${['北','东','南','西'][eliteIndex%4]}方发现敌将`);game.eliteSpawnCount=(game.eliteSpawnCount||0)+1}}
function spawnGem(x,y,n=1){game.gems.push({x,y,r:6,n,phase:rand(0,6)})}function puff(x,y,color,n=6){for(let i=0;i<n;i++){let a=rand(0,6.28),s=rand(35,130);game.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,color})}}
function nearest(range){let target=null,d=range;for(const e of game.enemies){let n=dist(game.p,e);if(n<d){d=n;target=e}}return target}
function damageEnemy(e,raw){let amount=raw;if(e.kind==='small'){const defense=.6+Math.max(0,game.damage-C.startingDamage)*.12;amount=Math.max(1,raw-defense)}else if(e.kind==='elite'){const defense=Math.max(1,game.damage*C.eliteDefenseFactor);amount=Math.max(1,raw*raw/(raw+defense))}else amount=Math.max(1,raw*.85);e.hp-=amount;e.hit=.12}
function useSkill(s){let target=nearest(Math.min(s.range,game.range+100));if(!target)return;const p=game.p,dx=target.x-p.x,dy=target.y-p.y,len=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx),dmg=s.damage*Math.pow(1.32,s.level-1)+game.damage*.35;if(s.type==='single')game.shots.push({x:p.x,y:p.y,vx:dx/len*520,vy:dy/len*520,r:6,dmg,pierce:Math.max(0,s.level-1),hit:new Set(),life:1.25});else if(s.type==='circle'){for(const e of game.enemies)if(dist(p,e)<=s.range+s.level*8)damageEnemy(e,dmg)}else if(s.type==='fan'){for(const e of game.enemies){let ex=e.x-p.x,ey=e.y-p.y,ed=Math.hypot(ex,ey),ea=Math.atan2(ey,ex);if(ed<=s.range+s.level*8&&Math.abs(Math.atan2(Math.sin(ea-ang),Math.cos(ea-ang)))<.62)damageEnemy(e,dmg)}}else if(s.type==='lottery'){let hits=1+Math.floor(Math.random()*3);for(let i=0;i<hits;i++)damageEnemy(target,dmg*rand(.7,1.65));puff(target.x,target.y,'#ffe27c',7)}}
function eligibleSkills(){const list=[];if(game.skills.length<6)for(const s of SKILLS)if(!game.skills.some(h=>h.id===s.id))list.push({kind:'newSkill',skill:s});for(const s of game.skills)list.push({kind:'skillLevel',skill:s});return list}
function cardsFor(source){let options=[...eligibleSkills()];for(const g of GEAR){if(game.gear[g.slot]?.id===g.id)options.push({kind:'gearLevel',gear:g});else if(!game.gear[g.slot])options.push({kind:'gearNew',gear:g});else if(game.gear[g.slot]?.id!==g.id)options.push({kind:'gearReplace',gear:g})}options.push({kind:'heal'},{kind:'damage'},{kind:'speed'});options=options.sort(()=>Math.random()-.5);const picked=[];for(const o of options){if(picked.length>=3)break;if(!picked.some(x=>x.kind===o.kind&&x.skill?.id===o.skill?.id&&x.gear?.id===o.gear?.id))picked.push(o)}return picked}
let activeCards=[],activeSource='level';function openPick(source){state='pick';activeSource=source;activeCards=cardsFor(source);$('pickEyebrow').textContent=source==='chest'?'地面宝箱 · 三选一':'升级奖励 · 三选一';$('pickTitle').textContent=source==='chest'?`宝箱战利品（花费 ${game.chest.price} 金币）`:'选择成长';$('pickSub').textContent='技能与装备共用同一升级选择池；同名技能/装备卡仅升级对应对象。';renderCards();show('pick')}
function renderCards(){const box=$('cards');box.replaceChildren();for(const o of activeCards){const c=document.createElement('button');c.className='card';c.type='button';const d=describe(o);c.innerHTML=`<div class="icon">${d.icon}</div><strong>${d.title}</strong><span>${d.desc}</span>`;c.onclick=()=>choose(o,activeSource);box.append(c)}}
function describe(o){if(o.kind==='newSkill')return{icon:o.skill.icon,title:`新技能：${o.skill.name}`,desc:o.skill.desc};if(o.kind==='skillLevel')return{icon:o.skill.icon,title:`${o.skill.name} 升级`,desc:`当前 Lv.${o.skill.level} → Lv.${o.skill.level+1}，提升该技能效果。`};if(o.kind==='gearNew')return{icon:o.gear.icon,title:`新装备：${o.gear.name}`,desc:`${o.gear.slot} · ${o.gear.stat}。空槽直接穿戴。`};if(o.kind==='gearLevel')return{icon:o.gear.icon,title:`${o.gear.name} 强化`,desc:`同名装备材料升级至 Lv.${game.gear[o.gear.slot].level+1}。`};if(o.kind==='gearReplace')return{icon:o.gear.icon,title:`替换${o.gear.slot}：${o.gear.name}`,desc:`${o.gear.stat}。先对比属性并确认。`};if(o.kind==='heal')return{icon:'❤️',title:'军医救治',desc:'恢复 45 点生命。'};if(o.kind==='damage')return{icon:'⚔️',title:'精炼兵刃',desc:'基础攻击力 +20%。'};return{icon:'🐎',title:'疾行军',desc:'移动速度 +12%。'}}
function choose(o,source){if(o.kind==='gearReplace'){replacePending={gear:o.gear,source};const old=game.gear[o.gear.slot];$('replaceTitle').textContent=`替换${o.gear.slot}装备？`;$('replaceSub').textContent='该栏位已有装备。确认替换会移除旧装备；取消则保留。';$('oldGear').innerHTML=`${old.icon} <b>${old.name} Lv${old.level}</b><br>${gearStats(old)}`;$('newGear').innerHTML=`${o.gear.icon} <b>${o.gear.name} Lv1</b><br>${o.gear.stat}`;show('replace');return}applyReward(o);finishPick(source)}
function gearStats(g){let b=g.bonus||{};return `攻击 +${Math.round((b.damage||0)*g.level)} · 生命 +${Math.round((b.health||0)*g.level)} · 减伤 ${Math.round((b.reduction||0)*g.level*100)}% · 移速 +${Math.round((b.speed||0)*g.level*100)}%`}
function applyGear(g){let old=game.gear[g.slot];if(old&&old.id===g.id){old.level++;applyGearStats();return}game.gear[g.slot]={...g,level:1};applyGearStats()}
function applyGearStats(){game.damage=C.startingDamage;game.range=C.attackRange;game.speed=C.playerSpeed;game.reduction=0;game.xpBonus=0;game.p.max=C.playerHealth;for(const slot of slots){const g=game.gear[slot];if(!g)continue;const b=g.bonus,n=g.level;game.damage+=(b.damage||0)*n;game.range+=(b.range||0)*n;game.speed*=(1+(b.speed||0)*n);game.reduction=Math.min(.65,game.reduction+(b.reduction||0)*n);game.xpBonus+=(b.xp||0)*n;game.p.max+=(b.health||0)*n}game.p.hp=Math.min(game.p.max,game.p.hp)}
function applyReward(o){if(o.kind==='newSkill')game.skills.push({...o.skill,level:1,cool:.2});else if(o.kind==='skillLevel')o.skill.level++;else if(o.kind==='gearNew'||o.kind==='gearLevel')applyGear(o.gear);else if(o.kind==='heal')game.p.hp=Math.min(game.p.max,game.p.hp+45);else if(o.kind==='damage')game.damage*=1.2;else if(o.kind==='speed')game.speed*=1.12;hud()}
function finishPick(source){hide();if(source==='chest'){game.chest=null;game.chestKills=0;chestPriceAfterPurchase();spawnChest()}state='playing';last=performance.now();hud()}
$('confirmReplace').onclick=()=>{if(replacePending){applyGear(replacePending.gear);finishPick(replacePending.source);replacePending=null}};$('cancelReplace').onclick=()=>{replacePending=null;state='pick';renderCards();show('pick')};
function spawnBoss(){spawnEnemy('boss');game.bossIndex++;game.bossNext+=C.bossInterval;toast(`Boss ${game.bossIndex} 出现！`)}
function bossAttack(e,dt){if(e.kind!=='boss')return;let d=dist(e,game.p);e.angle=Math.atan2(game.p.y-e.y,game.p.x-e.x);e.attackClock-=dt;if(e.phase==='idle'&&e.attackClock<=0){e.phase=Math.random()<.55?'aim':'arc';e.telegraph=1;e.aim={x:game.p.x,y:game.p.y};e.angle=Math.atan2(game.p.y-e.y,game.p.x-e.x)}else if(e.phase!=='idle'){e.telegraph-=dt;if(e.telegraph<=0){if(e.phase==='aim'){if(Math.hypot(game.p.x-e.aim.x,game.p.y-e.aim.y)<43){game.p.hp=0;endGame(false);return}}else{const now=Math.atan2(game.p.y-e.y,game.p.x-e.x),delta=Math.abs(Math.atan2(Math.sin(now-e.angle),Math.cos(now-e.angle)));if(d<205&&delta<.78&&game.p.inv<=0)game.p.hp-=game.p.max*.72}e.phase='idle';e.attackClock=rand(2.2,3.3)}}}
function update(dt){if(state!=='playing'||!game)return;game.t+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('on')}
const rate=game.t<60?C.smallPerSecond:C.postMinuteSmallPerSecond;game.spawnClock+=dt;while(game.spawnClock>=1/rate){game.spawnClock-=1/rate;spawnEnemy('small')}
while(game.eliteIndex<game.eliteSchedule.length&&game.t>=game.eliteSchedule[game.eliteIndex]){spawnEnemy('elite',game.eliteIndex%4);game.eliteIndex++}if(game.bossIndex<C.bossTotal&&game.t>=game.bossNext)spawnBoss();
let p=game.p,x=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+touch.x,y=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+touch.y,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}if(x||y){p.fx=x;p.fy=y}if((keys.has(' ')||keys.has('shift'))&&(game.dash||0)<=0){p.x+=(x||p.fx)*145;p.y+=(y||p.fy)*145;p.inv=.5;game.dash=3;keys.delete(' ');keys.delete('shift');puff(p.x,p.y,'#f2d98c',12)}game.dash=Math.max(0,(game.dash||0)-dt);p.x=clamp(p.x+x*game.speed*dt,p.r,C.mapW-p.r);p.y=clamp(p.y+y*game.speed*dt,p.r,C.mapH-p.r);p.inv=Math.max(0,p.inv-dt);
if(game.chest&&dist(p,game.chest)<p.r+game.chest.r+15){if(game.gold>=game.chest.price){game.gold-=game.chest.price;openPick('chest');return}else toast(`宝箱需要 ${game.chest.price} 金币（当前 ${game.gold}）`)}
for(const e of game.enemies){e.hit=Math.max(0,e.hit-dt);let d=dist(p,e),dx=p.x-e.x,dy=p.y-e.y,n=d||1;if(e.kind!=='elite'||e.aggro||d<C.eliteAggroRange){if(e.kind==='elite')e.aggro=true;e.x+=dx/n*e.speed*dt;e.y+=dy/n*e.speed*dt}if(e.kind==='boss'){bossAttack(e,dt);if(state!=='playing')return}if(d<p.r+e.r&&p.inv<=0){p.hp-=Math.max(1,e.damage*(1-game.reduction));p.inv=.65;if(p.hp<=0){endGame(false);return}}}
for(const s of game.skills){s.cool-=dt;if(s.cool<=0){useSkill(s);s.cool=s.rate*Math.max(.5,1-(s.level-1)*.08)}}
for(const b of game.shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of game.enemies){if(b.hit.has(e))continue;if(dist(b,e)<b.r+e.r){damageEnemy(e,b.dmg);b.hit.add(e);if(b.pierce<=0){b.life=0;break}b.pierce--}}}game.shots=game.shots.filter(b=>b.life>0);
for(let i=game.enemies.length-1;i>=0;i--){const e=game.enemies[i];if(e.hp<=0){game.enemies.splice(i,1);game.kills++;if(e.kind==='small'){game.smallKills++;game.chestKills++;if(game.smallKills%5===0)game.gold+=3}if(e.kind==='elite')game.gold+=25;if(e.kind==='boss')game.gold+=150;spawnGem(e.x,e.y,e.kind==='boss'?12:e.kind==='elite'?4:1);puff(e.x,e.y,e.kind==='boss'?'#ffcf68':'#e98e66',e.kind==='boss'?20:7);if(e.kind==='small'&&!game.chest&&game.chestKills>=C.chestKills)spawnChest();if(e.kind==='boss'&&game.bossIndex>=C.bossTotal){endGame(true);return}}}
for(let i=game.gems.length-1;i>=0;i--){let g=game.gems[i];g.phase+=dt*3;let d=dist(g,p);if(d<100){let n=d||1;g.x+=(p.x-g.x)/n*170*dt;g.y+=(p.y-g.y)/n*170*dt}if(d<p.r+g.r+5){game.xp+=g.n*(1+game.xpBonus);game.gems.splice(i,1);if(game.xp>=game.next){game.xp-=game.next;game.level++;game.next=C.levelXp+(game.level-1)*C.xpStep;openPick('level');return}}}
for(const f of game.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;f.vx*=.96;f.vy*=.96}game.fx=game.fx.filter(f=>f.life>0);hud()}
function endGame(win){state='end';$('endTitle').textContent=win?'五将伏诛 · 乱世暂平':'征战止步';$('endSummary').textContent=`生存 ${fmt(game.t)} · 击败 ${game.kills} · 金币 ${game.gold} · 等级 ${game.level} · 首领 ${game.bossIndex}/5`;show('end')}
$('startBtn').onclick=fresh;$('again').onclick=fresh;$('resume').onclick=()=>{state='playing';hide();last=performance.now()};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(k==='escape'){if(state==='playing'){state='paused';show('pause')}else if(state==='paused'){state='playing';hide();last=performance.now()}}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();if(state==='playing'){state='paused';show('pause')}});
const stick=$('stick'),nub=$('nub');let pid=null;function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,mx=r.width*.34,n=Math.hypot(dx,dy)||1,k=Math.min(1,mx/n);touch={x:dx/n*k,y:dy/n*k};nub.style.transform=`translate(calc(-50% + ${touch.x*mx}px),calc(-50% + ${touch.y*mx}px))`}function stickUp(e){if(pid!==e.pointerId)return;pid=null;touch={x:0,y:0};nub.style.transform='translate(-50%,-50%)'}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);stickMove(e)};stick.onpointermove=e=>{if(pid===e.pointerId)stickMove(e)};stick.onpointerup=stickUp;stick.onpointercancel=stickUp;$('dash').onpointerdown=e=>{e.preventDefault();keys.add(' ')};$('dash').onpointerup=()=>keys.delete(' ');
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#191311';ctx.fillRect(0,0,W,H);if(!game)return;const camX=clamp(game.p.x-viewW/2,0,Math.max(0,C.mapW-viewW)),camY=clamp(game.p.y-viewH/2,0,Math.max(0,C.mapH-viewH));ctx.save();ctx.translate((W-viewW*scale)/2,(H-viewH*scale)/2);ctx.scale(scale,scale);ctx.translate(-camX,-camY);
ctx.fillStyle='#70583d';ctx.fillRect(0,0,C.mapW,C.mapH);for(let y=0;y<C.mapH;y+=74)for(let x=0;x<C.mapW;x+=74){let q=(Math.floor(x/74)*13+Math.floor(y/74)*17)%5;ctx.fillStyle=q%2?'#766047':'#80674b';ctx.fillRect(x+2,y+2,70,70);ctx.fillStyle='#a8906655';ctx.beginPath();ctx.ellipse(x+25,y+22,18,8,.35,0,6.28);ctx.fill();if(q===2){ctx.fillStyle='#423b2a';ctx.fillRect(x+49,y+39,8,7)}}ctx.strokeStyle='#d3b77b';ctx.lineWidth=5;ctx.strokeRect(2,2,C.mapW-4,C.mapH-4);
for(const s of game.skills)if(s.type==='circle'&&s.cool<.16){ctx.beginPath();ctx.arc(game.p.x,game.p.y,s.range+s.level*8,0,6.28);ctx.strokeStyle='#ffdc7866';ctx.lineWidth=2;ctx.stroke()}
for(const e of game.enemies){if(e.kind==='boss'&&e.phase==='aim'){ctx.beginPath();ctx.arc(e.aim.x,e.aim.y,43,0,6.28);ctx.fillStyle='#f33a3080';ctx.fill();ctx.strokeStyle='#ffb8a2';ctx.stroke()}if(e.kind==='boss'&&e.phase==='arc'){ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.arc(e.x,e.y,205,e.angle-.78,e.angle+.78);ctx.closePath();ctx.fillStyle='#ed4b3680';ctx.fill();ctx.strokeStyle='#ffc587';ctx.stroke()}}
if(game.chest){let c=game.chest;ctx.fillStyle='#d5a448';ctx.strokeStyle='#ffe3a0';ctx.lineWidth=3;ctx.fillRect(c.x-15,c.y-11,30,23);ctx.strokeRect(c.x-15,c.y-11,30,23);ctx.fillStyle='#684229';ctx.fillRect(c.x-15,c.y-3,30,6);ctx.fillStyle='#fff0a8';ctx.fillRect(c.x-2,c.y-3,5,7);ctx.fillStyle='#fff0c2';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(`${c.price} 金`,c.x,c.y-22);ctx.beginPath();ctx.arc(c.x,c.y,27+Math.sin(game.t*4)*3,0,6.28);ctx.strokeStyle='#ffe58a77';ctx.stroke()}
for(const g of game.gems){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#a4f0cf';ctx.shadowColor='#98ffd7';ctx.shadowBlur=12;ctx.fillRect(-5,-5,10,10);ctx.restore()}for(const b of game.shots){ctx.beginPath();ctx.fillStyle='#fff0a2';ctx.shadowColor='#ffbf5d';ctx.shadowBlur=13;ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();ctx.shadowBlur=0}
for(const e of game.enemies){ctx.save();ctx.translate(e.x,e.y);let boss=e.kind==='boss',elite=e.kind==='elite';ctx.shadowColor=boss?'#ff6545':'#000';ctx.shadowBlur=boss?20:5;ctx.fillStyle=e.hit>0?'#fff':boss?'#9d382d':elite?'#bd6643':'#567349';ctx.strokeStyle=boss?'#ffd27a':elite?'#ffd190':'#c6ad75';ctx.lineWidth=boss?4:2;ctx.beginPath();ctx.arc(0,0,e.r,0,6.28);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#edd8a8';ctx.beginPath();ctx.arc(-e.r*.28,-2,e.r*.13,0,6.28);ctx.arc(e.r*.28,-2,e.r*.13,0,6.28);ctx.fill();ctx.fillStyle='#40251e';ctx.fillRect(-e.r*.45,4,e.r*.9,4);ctx.fillStyle=boss?'#f2cf72':elite?'#d85e39':'#91a36a';ctx.beginPath();ctx.moveTo(-e.r*.48,-e.r*.45);ctx.quadraticCurveTo(-e.r*.7,-e.r*1.25,0,-e.r*.75);ctx.quadraticCurveTo(e.r*.75,-e.r*1.1,e.r*.48,-e.r*.4);ctx.closePath();ctx.fill();
if(boss||elite){let bw=boss?76:60,by=-e.r-23;ctx.fillStyle='#22110e';ctx.fillRect(-bw/2,by,bw,7);ctx.fillStyle=boss?'#ef5945':'#efaa50';ctx.fillRect(-bw/2,by,bw*clamp(e.hp/e.max,0,1),7);ctx.strokeStyle='#ffe1a0';ctx.lineWidth=1;ctx.strokeRect(-bw/2,by,bw,7);ctx.fillStyle='#fff0ba';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(boss?'Boss':'精英',0,by-4)}ctx.restore()}
const p=game.p;ctx.save();ctx.translate(p.x,p.y);if(p.inv>0&&Math.floor(game.t*20)%2===0)ctx.globalAlpha=.4;ctx.shadowColor='#ffe28e';ctx.shadowBlur=18;ctx.fillStyle='#bd6543';ctx.beginPath();ctx.arc(0,0,p.r+4,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f1d5a0';ctx.beginPath();ctx.arc(0,-2,p.r*.67,0,6.28);ctx.fill();ctx.fillStyle='#ad382b';ctx.beginPath();ctx.arc(0,-p.r*.38,p.r*.68,Math.PI,0);ctx.fill();ctx.fillStyle='#e2b553';ctx.fillRect(-p.r*.72,-p.r*.2,p.r*1.44,4);ctx.strokeStyle='#f3d982';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(p.fx*18,5+p.fy*18);ctx.stroke();ctx.restore();for(const f of game.fx){ctx.globalAlpha=clamp(f.life/.45,0,1);ctx.fillStyle=f.color;ctx.fillRect(f.x,f.y,4,4)}ctx.globalAlpha=1;ctx.restore()}
function frame(now){let dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
