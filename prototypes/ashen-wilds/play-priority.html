<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>烽火三国 - 精英优先攻击试玩版</title>
<style>body{margin:0;background:#171312;color:#f5e9cf;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.message{max-width:620px;margin:24px;padding:24px;border:1px solid #c9a55b;border-radius:12px;background:#30231d;line-height:1.6}a{color:#ffe09a}</style>
</head>
<body><div class="message" id="status">正在加载修正版本……</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const response=await fetch('./index.html',{cache:'no-store'});
    if(!response.ok)throw new Error(`读取原型失败 (${response.status})`);
    let html=await response.text();
    const oldTarget="function useSkill(s){let target=nearest(Math.min(s.range,game.range+100));if(!target)return;const p=game.p";
    const newTarget="function nearestPriorityTarget(range){let nearestAny=null,nearestAnyDistance=range,priority=null,priorityDistance=Math.min(range,C.eliteAggroRange);for(const enemy of game.enemies){const d=dist(game.p,enemy);if(d>range)continue;if(d<nearestAnyDistance){nearestAnyDistance=d;nearestAny=enemy}if((enemy.kind==='elite'||enemy.kind==='boss')&&d<=C.eliteAggroRange&&d<priorityDistance){priorityDistance=d;priority=enemy}}return priority||nearestAny}\nfunction useSkill(s){let target=(s.type==='single'||s.type==='lottery')?nearestPriorityTarget(Math.min(s.range,game.range+100)):nearest(Math.min(s.range,game.range+100));if(!target)return;const p=game.p";
    const occurrences=html.split(oldTarget).length-1;
    if(occurrences!==1)throw new Error(`无法安全应用补丁：预期找到 1 处技能选目标代码，实际找到 ${occurrences} 处。请更新原型后重试。`);
    html=html.replace(oldTarget,newTarget);
    document.open();document.write(html);document.close();
  }catch(error){status.textContent=`加载失败：${error.message}。请通过本地 HTTP 服务器打开此页面，而不是直接以 file:// 打开。`}
})();
</script></body></html>
