<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>烽火三国 - 奖励隔离修正版</title>
<style>body{margin:0;background:#171312;color:#f5e9cf;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.message{max-width:620px;margin:24px;padding:24px;border:1px solid #c9a55b;border-radius:12px;background:#30231d;line-height:1.6}a{color:#ffe09a}</style>
</head>
<body><div class="message" id="status">正在检查奖励隔离并启动修正版……</div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const replacements=[
  ["function openLevelSkillReward(){game.rewardQueue.push('skill');showNextReward()}function openChestEquipmentReward(){game.rewardQueue.push('equipment');showNextReward()}","function openLevelSkillReward(){game.rewardOrigin='level';game.rewardQueue.push('skill');showNextReward()}function openChestEquipmentReward(){game.rewardOrigin='chest';game.rewardQueue.push('equipment');showNextReward()}","独立技能/宝箱发放入口"],
  ["function queueKillRewards(kind){if(kind==='elite')game.rewardQueue.push('skill','equipment');else if(kind==='boss')game.rewardQueue.push('skill','skill','equipment','equipment');if(game.rewardQueue.length)showNextReward()}","function queueKillRewards(kind){if(kind==='elite'){game.rewardOrigin='elite';game.rewardQueue.push('skill','equipment')}else if(kind==='boss'){game.rewardOrigin='boss';game.rewardQueue.push('skill','skill','equipment','equipment')}if(game.rewardQueue.length)showNextReward()}","精英/Boss 独立奖励队列"],
  ["function selectRewardCard(type,card){if(type!==game.activeRewardType)return;","function selectRewardCard(type,card){if(type!==game.activeRewardType||(type==='skill'&&!card.type.startsWith('skill-'))||(type==='equipment'&&!card.type.startsWith('equipment-')))return;","奖励类型硬校验"],
  ["function finishRewardSequence(){game.rewardQueue=[];game.activeRewardType=null;game.rewardSource=null;game.pendingEquipment=null;if(game.chest){game.chest=null;game.chestKills=0;chestPriceAfterPurchase();spawnChest()}state='playing';hide();last=performance.now();hud()}","function finishRewardSequence(){const completedOrigin=game.rewardOrigin;game.rewardQueue=[];game.activeRewardType=null;game.rewardSource=null;game.pendingEquipment=null;game.rewardOrigin=null;if(completedOrigin==='chest'&&game.chest){game.chest=null;game.chestKills=0;chestPriceAfterPurchase();spawnChest()}state='playing';hide();last=performance.now();hud()}","只在真正开箱后扣除宝箱/递增价格"]
 ];
 try{
  const response=await fetch('./index.html',{cache:'no-store'});
  if(!response.ok)throw new Error(`读取 index.html 失败 (${response.status})`);
  let html=await response.text();
  for(const [before,after,label] of replacements){const count=html.split(before).length-1;if(count!==1)throw new Error(`${label}补丁无法安全应用：预期匹配 1 处，实际 ${count} 处。`);html=html.replace(before,after)}
  if(!html.includes('function buildLevelSkillCards()')||!html.includes('function buildChestEquipmentCards()'))throw new Error('技能池或装备池入口不存在，拒绝运行未隔离的奖励版本。');
  document.open();document.write(html);document.close();
 }catch(error){status.textContent=`未能启动安全修正版：${error.message} 请确认与 index.html 同目录并使用本地 HTTP 服务器访问。`}
})();
</script></body></html>
